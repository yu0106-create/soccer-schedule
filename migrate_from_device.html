<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>축구교실 시간표 — 기기 데이터 가져오기</title>
<style>
  :root{
    --ink:#14171c; --sub:#6b7280; --line:#d7deea; --accent:#1e3a8a;
    --accent-soft:#e2e7f7; --danger:#c0392b; --ok:#2f8f4e;
  }
  *{box-sizing:border-box;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--ink); background:#fff; margin:0; padding:20px 16px 60px;
  }
  .wrap{max-width:640px;margin:0 auto;}
  h1{font-size:20px;margin:0 0 6px;}
  p.lead{font-size:14px;color:var(--sub);line-height:1.5;margin:0 0 20px;}
  .box{border:1px solid var(--line);padding:14px;margin-bottom:14px;}
  .box-title{font-size:14px;font-weight:700;color:var(--sub);margin:0 0 8px;}
  .status{font-size:14px;line-height:1.6;}
  .status.error{color:var(--danger);}
  .week-row{
    display:flex;align-items:center;gap:10px;
    padding:8px 0;border-top:1px solid var(--line);
    font-size:14px;
  }
  .week-row:first-child{border-top:none;}
  .week-row label{flex:1;display:flex;flex-direction:column;gap:2px;cursor:pointer;}
  .week-row input[type=checkbox]{width:18px;height:18px;flex-shrink:0;}
  .week-date{font-weight:600;}
  .week-meta{font-size:12px;color:var(--sub);}
  .tag{
    display:inline-block;font-size:11px;font-weight:700;
    padding:2px 6px;margin-left:6px;border-radius:0;
  }
  .tag.new{background:var(--accent-soft);color:var(--accent);}
  .tag.newer-local{background:#fff4dc;color:#8a5b00;}
  .tag.newer-remote{background:#fdeceb;color:var(--danger);}
  .tag.same{background:#eee;color:var(--sub);}
  button{
    -webkit-appearance:none;appearance:none;border:none;cursor:pointer;
    font-family:inherit;font-size:16px;font-weight:600;padding:12px 18px;
    min-height:46px;width:100%;
  }
  .btn-primary{background:var(--accent);color:#fff;margin-top:10px;}
  .btn-primary:disabled{background:#aab4cc;}
  .global-check{display:flex;align-items:flex-start;gap:10px;font-size:14px;line-height:1.5;}
  .global-check input{width:18px;height:18px;margin-top:2px;flex-shrink:0;}
  .warn{font-size:12.5px;color:var(--danger);margin-top:6px;}
  #log{white-space:pre-wrap;font-size:13px;color:var(--sub);margin-top:10px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>⚽ 이 기기에 저장된 시간표 데이터 가져오기</h1>
  <p class="lead">
    이 페이지를 <b>예전 데이터가 남아있는 그 기기/브라우저</b>에서 열어야 의미가 있어요.
    이 기기의 localStorage(브라우저 안에만 저장돼 있던 이전 데이터)를 읽어서,
    선택한 항목만 Firestore(클라우드)로 올려줍니다. 업로드가 끝나면 축구교실 앱을
    어느 기기에서 열든 그 데이터가 보이게 돼요.
  </p>

  <div class="box">
    <p class="box-title">1. 이 기기에서 찾은 데이터</p>
    <div class="status" id="localStatus">확인 중...</div>
  </div>

  <div class="box" id="weeksBox" style="display:none;">
    <p class="box-title">2. 클라우드로 올릴 주간 데이터 선택</p>
    <div id="weeksList"></div>
  </div>

  <div class="box" id="globalBox" style="display:none;">
    <p class="box-title">3. 기본 시간표 / 이름 목록도 올릴까요?</p>
    <label class="global-check">
      <input type="checkbox" id="globalCheck">
      <span id="globalCheckLabel">기본 시간표·이름 목록·기본 수업료도 함께 올리기</span>
    </label>
    <p class="warn" id="globalWarn"></p>
  </div>

  <button class="btn-primary" id="uploadBtn" style="display:none;" disabled>선택한 데이터 클라우드로 올리기</button>
  <div id="log"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
  import { getFirestore, doc, setDoc, getDoc, getDocs, collection } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDhixzMFjuydP-EQbqQsdkM3OWA0e504AM",
    authDomain: "soccer-schedule-8f27b.firebaseapp.com",
    projectId: "soccer-schedule-8f27b",
    storageBucket: "soccer-schedule-8f27b.firebasestorage.app",
    messagingSenderId: "124179804938",
    appId: "1:124179804938:web:64439993e82608e07e00f3"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const stateRef = doc(db, "soccer", "state");
  const weeksCol = collection(db, "soccer", "state", "weeks");
  const CACHE_KEY = 'soccer_state_cache_v1';

  const localStatusEl = document.getElementById('localStatus');
  const weeksBox = document.getElementById('weeksBox');
  const weeksListEl = document.getElementById('weeksList');
  const globalBox = document.getElementById('globalBox');
  const globalCheck = document.getElementById('globalCheck');
  const globalCheckLabel = document.getElementById('globalCheckLabel');
  const globalWarn = document.getElementById('globalWarn');
  const uploadBtn = document.getElementById('uploadBtn');
  const logEl = document.getElementById('log');

  function rowToFsObj(r){
    r = r || [];
    return { name:r[0]||'', day:r[1]||'', time:r[2]||'', place:r[3]||'', round:r[4]||'1', paid:r[5]||'', end:r[6]||'', fee:r[7]||'', attended: (r[8] !== 'false' && r[8] !== false) };
  }
  function baseRowToFsObj(r){
    r = r || [];
    return { name:r[0]||'', day:r[1]||'', time:r[2]||'', place:r[3]||'' };
  }
  function fmtDate(ms){
    if (!ms) return '알 수 없음';
    const d = new Date(ms);
    return `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }

  let local = null;

  async function main(){
    let raw;
    try{ raw = localStorage.getItem(CACHE_KEY); } catch(e){ raw = null; }
    if (!raw){
      localStatusEl.textContent = '이 기기(브라우저)에는 저장된 이전 데이터가 없어요. 축구교실 앱을 실제로 썼던 기기·브라우저에서 이 페이지를 열어주세요.';
      localStatusEl.classList.add('error');
      return;
    }
    try{ local = JSON.parse(raw); } catch(e){
      localStatusEl.textContent = '저장된 데이터를 읽는 중 오류가 났어요. (형식이 손상됨)';
      localStatusEl.classList.add('error');
      return;
    }

    const weekKeys = Object.keys(local.weekEntries || {}).sort();
    const studentCount = (local.baseSchedule || []).length;
    localStatusEl.innerHTML = `주간 데이터 <b>${weekKeys.length}개</b>, 기본 시간표 학생 <b>${studentCount}명</b> 찾음.<br>마지막 저장: ${fmtDate(local.updatedAt)}`;

    // 원격(클라우드) 상태와 비교해서 보여주기
    let remoteWeeks = {};
    try{
      const snap = await getDocs(weeksCol);
      snap.forEach(d => { remoteWeeks[d.id] = d.data(); });
    } catch(e){
      logEl.textContent = '클라우드 주간 데이터를 불러오는 중 오류: ' + e.message;
    }

    if (weekKeys.length === 0){
      weeksBox.style.display = 'none';
    } else {
      weeksBox.style.display = 'block';
      weeksListEl.innerHTML = '';
      weekKeys.forEach(function(key){
        const entry = local.weekEntries[key] || {};
        const remote = remoteWeeks[key];
        let tag = '<span class="tag new">클라우드에 없음</span>';
        let checkedDefault = true;
        if (remote){
          const rUpdated = remote.updatedAt || 0;
          const lUpdated = entry.updatedAt || 0;
          if (lUpdated > rUpdated){
            tag = '<span class="tag newer-local">이 기기가 더 최신</span>';
          } else if (lUpdated < rUpdated){
            tag = '<span class="tag newer-remote">클라우드가 더 최신</span>';
            checkedDefault = false; // 이미 클라우드가 더 최신이면 기본적으로 건드리지 않음
          } else {
            tag = '<span class="tag same">동일</span>';
            checkedDefault = false;
          }
        }
        const row = document.createElement('div');
        row.className = 'week-row';
        row.innerHTML = `
          <label>
            <input type="checkbox" data-key="${key}" ${checkedDefault ? 'checked' : ''}>
            <span class="week-date">${key} — ${entry.title || '(제목 없음)'} ${tag}</span>
            <span class="week-meta">이 기기 저장: ${fmtDate(entry.updatedAt)} · 항목 ${((entry.rows||[]).length)}개</span>
          </label>`;
        weeksListEl.appendChild(row);
      });
    }

    // 전역(기본 시간표 등) 비교
    let remoteGlobal = null;
    try{
      const gSnap = await getDoc(stateRef);
      remoteGlobal = gSnap.exists() ? gSnap.data() : null;
    } catch(e){
      logEl.textContent += '\n클라우드 기본 설정을 불러오는 중 오류: ' + e.message;
    }
    globalBox.style.display = 'block';
    if (remoteGlobal){
      globalCheckLabel.textContent = `기본 시간표·이름 목록·기본 수업료도 함께 올리기 (클라우드 마지막 저장: ${fmtDate(remoteGlobal.updatedAt)})`;
      globalWarn.textContent = '체크하면 지금 클라우드에 있는 기본 시간표/이름 목록/기본 수업료가 이 기기에 저장된 내용으로 완전히 덮어써져요. 다른 기기에서 이미 최신으로 관리하고 있다면 체크하지 마세요.';
    } else {
      globalWarn.textContent = '클라우드에 아직 기본 설정이 없어서, 체크하지 않아도 자동으로 필요해질 수 있어요.';
    }

    uploadBtn.style.display = 'block';
    uploadBtn.disabled = false;
  }

  uploadBtn.addEventListener('click', async function(){
    uploadBtn.disabled = true;
    uploadBtn.textContent = '올리는 중...';
    logEl.textContent = '';
    let successCount = 0, failCount = 0;

    const checked = Array.from(weeksListEl.querySelectorAll('input[type=checkbox]:checked'));
    for (const cb of checked){
      const key = cb.dataset.key;
      const entry = local.weekEntries[key] || { title: '', rows: [], updatedAt: Date.now() };
      const payload = { title: entry.title || '', rows: (entry.rows || []).map(rowToFsObj), updatedAt: entry.updatedAt || Date.now() };
      try{
        await setDoc(doc(weeksCol, key), payload);
        successCount++;
        logEl.textContent += `✓ ${key} 업로드 완료\n`;
      } catch(e){
        failCount++;
        logEl.textContent += `✗ ${key} 업로드 실패: ${e.message}\n`;
      }
    }

    if (globalCheck.checked){
      try{
        const payload = {
          locations: local.locations || { name: [], day: [], place: [] },
          baseSchedule: (local.baseSchedule || []).map(baseRowToFsObj),
          defaultFee: local.defaultFee || '50',
          updatedAt: Date.now()
        };
        await setDoc(stateRef, payload);
        logEl.textContent += `✓ 기본 시간표/이름 목록 업로드 완료\n`;
      } catch(e){
        logEl.textContent += `✗ 기본 시간표/이름 목록 업로드 실패: ${e.message}\n`;
      }
    }

    uploadBtn.textContent = `완료 (성공 ${successCount}건${failCount ? `, 실패 ${failCount}건` : ''})`;
    logEl.textContent += '\n이제 축구교실 앱을 다시 열어보면 이 데이터가 보일 거예요.';
  });

  main();
</script>
</body>
</html>
